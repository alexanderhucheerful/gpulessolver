[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpules"
version = "1.0.0"
description = "GPU Large-Eddy Simulation of urban wind fields (merged high-fidelity + differentiable lines)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gpules authors" }]
keywords = ["LES", "CFD", "GPU", "PyTorch", "urban", "wind", "differentiable", "PALM"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "pyyaml>=6.0",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "pytest-cov>=4.0"]
ai = ["xarray>=2023.1"]

[project.scripts]
gpules = "gpules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
